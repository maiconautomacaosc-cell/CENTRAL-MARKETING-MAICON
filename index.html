<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071722"><title>Central de Divulgação</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head><body>
<header><img src="assets/logo-maicon.png" alt="Maicon Automação"><div><b>Central de Divulgação</b><small>Materiais prontos para compartilhar</small></div></header>
<main>
<section class="hero"><span>DIVULGAÇÃO DE HOJE</span><h1 id="todayTitle">Carregando...</h1><p id="todayText"></p><div class="actions"><button class="primary" id="todayOpen">Abrir material</button><button id="nextSuggestion">Outra sugestão</button></div></section>
<section><div class="sectionHead"><h2>Materiais</h2><div class="filters"><button class="chip active" data-filter="all">Todos</button><button class="chip" data-filter="lock">🔐 Fechaduras</button><button class="chip" data-filter="electric">⚡ Elétrica</button><button class="chip" data-filter="furniture">🔧 Móveis</button></div></div><div id="materials" class="grid"></div></section>
<section><div class="sectionHead"><h2>Grupos de divulgação</h2><button class="small" id="addGroup">+ Grupo</button></div><p class="muted">Marque os grupos onde você já publicou hoje. A marcação reinicia automaticamente a cada dia.</p><div id="groups" class="groups"></div></section>
<section><div class="sectionHead"><h2>Histórico</h2><button class="small ghost" id="clearHistory">Limpar</button></div><div id="history" class="history"></div></section>
</main>
<nav><button data-jump="top">🏠<span>Início</span></button><button data-jump="materials">🖼️<span>Folders</span></button><button data-jump="groups">👥<span>Grupos</span></button><button data-jump="history">🕘<span>Histórico</span></button></nav>
<dialog id="materialDialog"><div class="dialogTop"><h3 id="dTitle"></h3><button id="closeDialog">✕</button></div><canvas id="artCanvas" width="1080" height="1080"></canvas><label>Texto para o grupo</label><textarea id="dText" rows="7"></textarea><div class="dialogActions"><button id="copyText">Copiar texto</button><button id="saveArt">Salvar arte</button><button class="primary" id="shareAll">Compartilhar</button></div><button class="done" id="markShared">✓ Registrar divulgação</button></dialog>
<script src="app.js"></script></body></html>
